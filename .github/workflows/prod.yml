name: prod-deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/**.md'
  workflow_dispatch:
    inputs:
      run-manually:
        required: true
        type: boolean
        description: Run Job Manually

jobs:
  release:
    if: |
      github.event_name == 'push' ||
      github.event.inputs.run-manually == 'true'
    name: prod-release
    runs-on: ubuntu-latest
    environment: prod
    concurrency: prod-release
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
        os: [ubuntu-latest]
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.IC_GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
      - name: Cache poetry dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create false
      - name: Install package
        run: poetry install
      - name: Python Semantic Release
        env:
          GH_TOKEN: ${{ secrets.IC_GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <actions@github.com>"
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          poetry run semantic-release version --push --vcs-release
          if [ -n "$(ls -A dist 2>/dev/null)" ]; then
            poetry run semantic-release publish
            poetry publish
          else
            echo "No new release detected; skipping publish."
          fi

  test:
    if: |
      github.event_name == 'push' ||
      github.event.inputs.run-manually == 'true'
    name: prod-test
    runs-on: ubuntu-latest
    needs: release
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
        os: [ubuntu-latest]
    steps:
      - name: Sleep for 120 seconds
        run: sleep 120s
        shell: bash
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Package
        run: |
          python -m pip install --upgrade pip
          python -m pip install instruqt-converter
      - name: Test instruqt_converter
        run: |
          convert --help
